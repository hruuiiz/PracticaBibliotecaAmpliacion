<div class="dashboard-container">
  <h3 class="titulo-dashboard">Top Libros / Novedades</h3>

  <div class="grid-libros">
    @for (libro of libros(); track libro.id) {
    <a class="tarjeta-libro" routerLink="/detalle/{{libro.id}}">
      <div class="imagen-contenedor">
        <img [src]="libro.imagen" alt="{{libro.titulo}}" class="imagen-libro">
      </div>
      <div class="info-libro">
        <h4>{{libro.titulo}}</h4>
      </div>
    </a>
    }
  </div>
</div>
